<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss: http://127.0.0.1:* http://localhost:* https:" />
  <title>Second Read</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Second Read <span class="sub">나를 읽는 마피아</span></div>
    <div class="topright">
      <div id="planBadge" class="plan-badge hidden">
        <img src="../assets/chatgpt-logo-white.svg" alt="" />
        <span>Using ChatGPT plan</span>
        <button class="link" data-open="https://chatgpt.com/settings/usage">Manage usage</button>
      </div>
      <div id="offlineBadge" class="offline-badge hidden">AI 없이 규칙 체험 중</div>
      <button id="settingsBtn" class="icon-btn" title="설정" aria-label="설정">⚙</button>
    </div>
  </header>

  <main id="screen"></main>

  <aside id="settings" class="drawer hidden" aria-label="설정"></aside>
  <div id="modal" class="modal-wrap hidden"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
